server.port=8080

# Куда gateway пересылает проверенные запросы. В Docker адрес приходит из переменной SHAREIT_SERVER_URL
shareit-server.url=http://localhost:9090

# в лог попадает каждый запрос gateway к серверу: метод, адрес и статус ответа
logging.level.org.springframework.web.client.RestTemplate=DEBUG
